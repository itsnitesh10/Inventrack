{% extends 'base.html' %}
{% block auth_content %}
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="logo-icon"><i class="bi bi-box-seam"></i></div>
      <h2>Welcome back</h2>
      <p>Sign in to InvenTrack</p>
    </div>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}
        <div class="alert alert-{{ cat }}"><i class="bi bi-info-circle"></i><div>{{ msg }}</div></div>
      {% endfor %}
    {% endwith %}
    <form method="POST">
      <div style="margin-bottom:16px">
        <label class="form-label">Username</label>
        <div class="input-group">
          <span class="input-icon"><i class="bi bi-person"></i></span>
          <input type="text" name="username" class="form-control" placeholder="Enter your username" required autofocus/>
        </div>
      </div>
      <div style="margin-bottom:24px">
        <label class="form-label">Password</label>
        <div class="input-group">
          <span class="input-icon"><i class="bi bi-lock"></i></span>
          <input type="password" name="password" class="form-control" placeholder="Enter your password" required/>
        </div>
      </div>
      <button type="submit" class="btn btn-primary btn-block btn-lg">
        <i class="bi bi-arrow-right-circle"></i> Sign In
      </button>
    </form>
    <div class="auth-divider"><span>or</span></div>
    <p style="text-align:center;color:var(--text-muted);font-size:13px">
      Don't have an account?
      <a href="{{ url_for('auth.register') }}" style="color:var(--primary);font-weight:600">Create one</a>
    </p>
  </div>
</div>
{% endblock %}
