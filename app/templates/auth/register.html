{% extends 'base.html' %}
{% block auth_content %}
<div class="auth-page">
  <div class="auth-card" style="max-width:460px">
    <div class="auth-logo">
      <div class="logo-icon"><i class="bi bi-person-plus"></i></div>
      <h2>Create account</h2>
      <p>Join InvenTrack today</p>
    </div>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}
        <div class="alert alert-{{ cat }}"><i class="bi bi-info-circle"></i><div>{{ msg }}</div></div>
      {% endfor %}
    {% endwith %}
    <form method="POST">
      <div style="margin-bottom:14px">
        <label class="form-label">Username</label>
        <div class="input-group">
          <span class="input-icon"><i class="bi bi-person"></i></span>
          <input type="text" name="username" class="form-control" placeholder="Choose a username" required/>
        </div>
      </div>
      <div style="margin-bottom:14px">
        <label class="form-label">Email</label>
        <div class="input-group">
          <span class="input-icon"><i class="bi bi-envelope"></i></span>
          <input type="email" name="email" class="form-control" placeholder="your@email.com" required/>
        </div>
      </div>
      <div style="margin-bottom:14px">
        <label class="form-label">Password</label>
        <div class="input-group">
          <span class="input-icon"><i class="bi bi-lock"></i></span>
          <input type="password" name="password" class="form-control" placeholder="Min 6 characters" required/>
        </div>
      </div>
      <div style="margin-bottom:24px">
        <label class="form-label">Role</label>
        <select name="role" class="form-select">
          <option value="staff">Staff</option>
          <option value="admin">Admin</option>
        </select>
      </div>
      <button type="submit" class="btn btn-primary btn-block btn-lg">
        <i class="bi bi-check-circle"></i> Create Account
      </button>
    </form>
    <div class="auth-divider"><span>or</span></div>
    <p style="text-align:center;color:var(--text-muted);font-size:13px">
      Already have an account?
      <a href="{{ url_for('auth.login') }}" style="color:var(--primary);font-weight:600">Sign in</a>
    </p>
  </div>
</div>
{% endblock %}
